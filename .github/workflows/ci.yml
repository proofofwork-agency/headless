name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-gate:
    name: ${{ matrix.os }} release gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The `runner` context is unavailable in job-level `env` (it fails workflow
      # validation before any job starts), so export these from a step instead.
      - name: Prepare environment
        env:
          STATE_HOME: ${{ runner.temp }}/headless-state
          REAL_NETWORK_TEST: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          echo "HEADLESS_STATE_HOME=$STATE_HOME" >> "$GITHUB_ENV"
          echo "HEADLESS_REAL_NETWORK_TEST=$REAL_NETWORK_TEST" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # setup-bun installs under ~/.bun, but contained workers see a tmpfs
          # over the real home, so bun-based test fixtures cannot resolve `bun`
          # inside the sandbox. A symlink is not enough — its target would be
          # masked by the same tmpfs — so copy the static binary to a system
          # path that the read-only root bind keeps visible.
          sudo cp "$(command -v bun)" /usr/local/bin/bun
          sudo chmod 755 /usr/local/bin/bun
          # Two-core hosted runners under full-suite load have exhausted the
          # shorter 15s and 30s run-tool observation windows even though the
          # same transports complete. This is capability evidence, not a
          # latency SLO, so use the existing 60s clamp only in Linux CI.
          echo "HEADLESS_RUN_TOOL_TIMEOUT_MS=60000" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify real Linux containment
        if: runner.os == 'Linux'
        run: |
          bwrap --version
          bun -e 'const { probeLinuxBwrap } = await import("./src/runtime/os-sandbox.ts"); const result = probeLinuxBwrap(); console.log(result); if (!result.ok) process.exit(1)'
          # Diagnostic visibility, not a gate: print the run-tool relay probe
          # verdict so hosted-runner transport regressions are explained in the
          # job log instead of surfacing as opaque downstream test failures.
          bun -e 'const { probeLinuxRunToolRelay } = await import("./src/runtime/os-sandbox.ts"); console.log("run-tool relay probe:", JSON.stringify(probeLinuxRunToolRelay()))'

      - name: Verify real macOS containment
        if: runner.os == 'macOS'
        run: |
          test -x /usr/bin/sandbox-exec
          bun -e 'const { probeDarwinSandboxWriteDenial } = await import("./src/runtime/os-sandbox.ts"); const result = probeDarwinSandboxWriteDenial(); console.log(result); if (!result.ok) process.exit(1)'

      - name: Typecheck and test
        run: bun run check

      - name: Build published artifacts
        run: bun run build

      - name: Pack, install, and invoke published artifacts
        run: bun run smoke:pack
