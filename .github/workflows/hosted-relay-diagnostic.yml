name: Hosted relay diagnostic

# RESOLVED 2026-08-04 — kept as a regression probe, no longer a reproducer.
#
# This job existed because the four tests/daemon-run-tool.test.ts cooperation
# cases failed on GitHub-hosted Linux and passed everywhere else, which was
# attributed to a hosted-runner incompatibility and a relay child that would not
# terminalize. Both attributions were wrong. The instrumented runs this job
# produced (30951464184, 30953476478) showed every stage succeeding while the
# daemon received ZERO complete frames: the Linux relay was discarding any
# request that arrived before its upstream Unix connect resolved. Fast hosts won
# that race, which is why only the hosted x86-64 leg failed. See
# bridgeStreamConnection in src/broker/linux-relay.ts, and
# docs/internal/hosted-linux-relay-follow-up.md for the full record.
#
# Those four now run unguarded on the ordinary ubuntu leg, so this job is no
# longer the only place they execute. It is retained because it is the only
# place that samples the process tree and sockets WHILE they run, which is what
# made the fault findable at all. It still does NOT retry, and it still never
# gates a merge: continue-on-error keeps a red diagnostic from blocking anyone,
# and the artifact is the deliverable.
#
# Manual only. It deliberately reproduces a known failure and would otherwise
# burn a runner on every push for a result we already expect.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: hosted x86-64 relay reproducer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install bubblewrap and match the release gate's userns setup
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install --yes -qq bubblewrap
          # ci.yml relaxes this before its containment probe; without the same
          # step strictContainmentAvailable() can be false here and all four
          # cases skip — a second, quieter way for this job to prove nothing.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Fail closed if containment is unavailable
        run: |
          set -euo pipefail
          # Without this the suite skips and the job looks like a clean run. The
          # point is to REPRODUCE a failure, so an environment that cannot even
          # attempt it must stop here rather than report nothing.
          bun -e 'const { probeLinuxBwrap } = await import("./src/runtime/os-sandbox.ts"); const r = probeLinuxBwrap(); console.log(r); if (!r.ok) process.exit(1)'

      - name: Record the environment the failure is attributed to
        run: |
          set -euo pipefail
          {
            echo "arch=$(uname -m) kernel=$(uname -r)"
            echo "bwrap=$(bwrap --version)"
            echo "userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"
            echo "apparmor_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
            echo "nproc=$(nproc)"
          } | tee environment.txt

      - name: Snapshot descendants while the cooperation cases run
        continue-on-error: true
        run: |
          set -uo pipefail
          # Sample the process tree every 2s for the life of the run. The fault
          # is a child that outlives its response, so the interesting evidence
          # is what is STILL ALIVE, which a post-hoc dump cannot show.
          ( while true; do
              echo "--- $(date -u +%H:%M:%S) ---"
              ps -eo pid,ppid,etimes,stat,comm,args | grep -E 'bwrap|bun|headless' | grep -v grep || true
              # Relay sockets AND the in-namespace loopback the supervisor
              # forwards from. The first run filtered on 'headless|run-tool|broker'
              # and therefore missed the run-tool socket entirely — it is named
              # "<pid>-<id>.tool.sock" under /tmp/hd*, matching none of those. The
              # decisive question is whether that socket is ever listening and
              # connected, so match the real names and include TCP.
              ss -xap 2>/dev/null | grep -E '\.sock|headless' || true
              ss -tanp 2>/dev/null | grep -E '38471|LISTEN' | head -20 || true
              sleep 2
            done ) > process-tree.log 2>&1 &
          echo $! > sampler.pid
          trap 'kill "$(cat sampler.pid)" 2>/dev/null || true' EXIT

          # HEADLESS_PRIVILEGED_CONTAINMENT_CI=1 is what makes the guarded
          # cases run here at all; that is the point of this job.
          HEADLESS_PRIVILEGED_CONTAINMENT_CI=1 CI=true NO_COLOR=1 \
            bun test tests/daemon-run-tool.test.ts 2>&1 | tee cooperation.log
          echo "exit=${PIPESTATUS[0]}" | tee -a cooperation.log

          kill "$(cat sampler.pid)" 2>/dev/null || true

      - name: Refuse a vacuous reproducer
        run: |
          set -euo pipefail
          # Every one of the four must appear as pass or fail. A skip means the
          # gate still excluded them and this job proved nothing — which is
          # exactly what it did before the predicate learned to honour the
          # override.
          for case_name in \
            "injects the scoped helper into the contained worker and revokes it at terminal state" \
            "runs one depth-one child and omits delegation from the child credential" \
            "returns child failure as tool data and lets the parent finish" \
            "returns child timeout as tool data inside the parent deadline"; do
            grep -qE "^\((pass|fail)\).*${case_name}" cooperation.log \
              || { echo "::error::case did not execute (skipped or absent): ${case_name}"; exit 1; }
          done
          echo "all four cooperation cases executed on hosted x86-64"

      - name: Extract the two scoped faults
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo "== fault 2: goal-ownership leakage =="
            grep -n "Unknown goal" cooperation.log || echo "(none observed)"
            echo
            echo "== per-case outcomes =="
            grep -E '^\((pass|fail|skip)\)' cooperation.log || echo "(no case lines)"
            echo
            echo "== survivors: processes alive in the final sample =="
            tail -40 process-tree.log
            echo
            echo "== daemon inventory after the run =="
            bun scripts/daemon-hygiene.ts || true
          } | tee findings.txt

      - name: Upload the reproducer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-relay-diagnostic
          path: |
            environment.txt
            cooperation.log
            process-tree.log
            findings.txt
          retention-days: 30
